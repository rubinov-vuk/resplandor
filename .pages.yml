# Editor settings for Pages CMS (https://app.pagescms.org).
# This is what lets you add stories and photos from the browser without touching code.
media:
  input: src/images
  output: /images

content:
  - name: stories
    label: Priče (Putopis)
    type: collection
    path: src/putopis
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, country, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Naslov
        type: string
        required: true
      - name: location
        label: Mesto (npr. Pisaq, Peru)
        type: string
      # Used by the "Sve Zemlje" filter. To add a country, add it here AND in src/_data/countries.json.
      - name: country
        label: Zemlja (za filter)
        type: select
        required: true
        options:
          values: [Kanada, SAD, Gvatemala, Peru, Bolivija, Kolumbija, Argentina, Čile, Brazil]
      - name: date
        label: Datum
        type: date
        required: true
      - name: cover
        label: Naslovna fotografija (prikazuje se u listi priča)
        type: image
        required: true
      - name: coverFocus
        label: Koji deo naslovne fotografije se vidi na kartici
        type: select
        default: center
        options:
          values:
            - { value: center, label: "Sredina" }
            - { value: top, label: "Gore" }
            - { value: bottom, label: "Dole" }
            - { value: left, label: "Levo" }
            - { value: right, label: "Desno" }
      - name: excerpt
        label: Kratak opis za listu (ako je prazno, uzima se početak priče)
        type: text
      - name: body
        label: Tekst priče
        type: rich-text
      # Parts shown after "Tekst priče", in the order they are listed here.
      # To start a story with a photo, leave "Tekst priče" empty and put a photo part first.
      - name: sections
        label: Delovi priče — tekst i fotografije, bilo kojim redom
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Tekst
            fields:
              - name: body
                label: Tekst
                type: rich-text
                format: markdown
              - name: align
                label: Poravnanje
                type: select
                default: left
                options:
                  values:
                    - { value: left, label: "Normalno (levo)" }
                    - { value: center, label: "Na sredini" }
                    - { value: center-italic, label: "Na sredini, kurziv (kao citat)" }
          - name: photos
            label: Fotografije
            fields:
              - name: items
                label: Fotografije
                type: object
                list: true
                fields:
                  - name: image
                    label: Fotografija
                    type: image
                  - name: caption
                    label: Opis fotografije
                    type: string
                  - name: layout
                    label: Raspored
                    type: select
                    default: full
                    options:
                      values:
                        - { value: full, label: "Širina teksta" }
                        - { value: wide, label: "Široka (šira od teksta)" }
                        - { value: screen, label: "Cela širina ekrana" }
                        - { value: half, label: "Pola (dve jedna pored druge)" }
                        - { value: small, label: "Mala, u sredini" }
                  - name: shape
                    label: Oblik (isecanje)
                    type: select
                    default: original
                    options:
                      values:
                        - { value: original, label: "Originalni oblik (bez isecanja)" }
                        - { value: landscape, label: "Položena 3:2" }
                        - { value: wide, label: "Široka 16:9" }
                        - { value: panorama, label: "Panorama 21:9" }
                        - { value: square, label: "Kvadrat 1:1" }
                        - { value: portrait, label: "Uspravna 4:5" }
                  - name: focus
                    label: Koji deo fotografije ostaje kad se iseče
                    type: select
                    default: center
                    options:
                      values:
                        - { value: center, label: "Sredina" }
                        - { value: top, label: "Gore" }
                        - { value: bottom, label: "Dole" }
                        - { value: left, label: "Levo" }
                        - { value: right, label: "Desno" }
                        - { value: top-left, label: "Gore levo" }
                        - { value: top-right, label: "Gore desno" }
                        - { value: bottom-left, label: "Dole levo" }
                        - { value: bottom-right, label: "Dole desno" }
                  - name: zoom
                    label: Uvećanje (približi deo fotografije)
                    type: select
                    default: "1"
                    options:
                      values:
                        - { value: "1", label: "Bez uvećanja" }
                        - { value: "1.25", label: "125%" }
                        - { value: "1.5", label: "150%" }
                        - { value: "2", label: "200%" }
      - name: gallery
        label: Fotografije na kraju priče
        type: object
        list: true
        fields:
          - name: image
            label: Fotografija
            type: image
          - name: caption
            label: Opis fotografije
            type: string
          - name: layout
            label: Raspored
            type: select
            default: full
            options:
              values:
                - { value: full, label: "Širina teksta" }
                - { value: wide, label: "Široka (šira od teksta)" }
                - { value: screen, label: "Cela širina ekrana" }
                - { value: half, label: "Pola (dve jedna pored druge)" }
                - { value: small, label: "Mala, u sredini" }
          - name: shape
            label: Oblik (isecanje)
            type: select
            default: original
            options:
              values:
                - { value: original, label: "Originalni oblik (bez isecanja)" }
                - { value: landscape, label: "Položena 3:2" }
                - { value: wide, label: "Široka 16:9" }
                - { value: panorama, label: "Panorama 21:9" }
                - { value: square, label: "Kvadrat 1:1" }
                - { value: portrait, label: "Uspravna 4:5" }
          - name: focus
            label: Koji deo fotografije ostaje kad se iseče
            type: select
            default: center
            options:
              values:
                - { value: center, label: "Sredina" }
                - { value: top, label: "Gore" }
                - { value: bottom, label: "Dole" }
                - { value: left, label: "Levo" }
                - { value: right, label: "Desno" }
                - { value: top-left, label: "Gore levo" }
                - { value: top-right, label: "Gore desno" }
                - { value: bottom-left, label: "Dole levo" }
                - { value: bottom-right, label: "Dole desno" }
          - name: zoom
            label: Uvećanje (približi deo fotografije)
            type: select
            default: "1"
            options:
              values:
                - { value: "1", label: "Bez uvećanja" }
                - { value: "1.25", label: "125%" }
                - { value: "1.5", label: "150%" }
                - { value: "2", label: "200%" }
      - name: draft
        label: Skica (ne objavljuj još)
        type: boolean
        default: false

  - name: home
    label: Početna strana
    type: file
    path: src/_data/home.json
    fields:
      - name: slides
        label: Velike fotografije na vrhu (menjaju se svakih 5 sekundi)
        type: object
        list: true
        fields:
          - name: image
            label: Fotografija
            type: image
            required: true
          - name: caption
            label: Natpis u gornjem desnom uglu (npr. Sveta Dolina, Peru, 2025)
            type: string
          - name: alt
            label: Opis fotografije (za slabovide i Google)
            type: string
          - name: focus
            label: Koji deo fotografije se vidi (0 = vrh, 50 = sredina, 100 = dno)
            type: number
            default: 50
      - name: heading
        label: Naslov
        type: string
      - name: intro
        label: Uvodni tekst (prazan red = novi pasus)
        type: text
      - name: quote
        label: Citat
        type: string
      - name: listHeading
        label: Naslov liste priča
        type: string
      - name: allCountries
        label: Tekst filtera „Sve Zemlje“
        type: string
      - name: noStories
        label: Poruka kad iz izabrane zemlje nema priča
        type: string
      - name: readMore
        label: Tekst linka „Čitaj još“
        type: string
      - name: nextStory
        label: Tekst „Sledeća priča“
        type: string

  - name: site
    label: Podešavanja sajta
    type: file
    path: src/_data/site.json
    fields:
      - name: title
        label: Ime sajta
        type: string
      - name: description
        label: Opis sajta (za Google i deljenje linka)
        type: text
      - name: author
        label: Autor
        type: string
      - name: language
        label: Jezik (kod)
        type: string
      - name: instagram
        label: Instagram link
        type: string
